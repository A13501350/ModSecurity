name: CI/CD for IIS Module

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        arch: [x64, x86]
        config: [Release, RelWithDebInfo]
    runs-on: windows-latest
    
    # For Caching
    permissions:
      actions: read
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Install Apache for x86
      if: matrix.arch == 'x86'
      shell: pwsh
      run: |
        $apachePath = "${{ github.workspace }}\apache-x86"
        New-Item -ItemType Directory -Path $apachePath -Force
        choco install apache-httpd -y --force --forcex86 --no-progress -r --params="'/installLocation:$apachePath /noService'"
        echo "APACHE_ROOT=$apachePath\Apache24" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Set Apache path for x64
      if: matrix.arch == 'x64'
      shell: pwsh
      run: |
        echo "APACHE_ROOT=C:\tools\Apache24" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2
      with:
        msystem: ${{ matrix.arch == 'x86' && 'MINGW32' || 'UCRT64' }}
        update: true
        install: >
          git
          make
          autoconf
          automake
          libtool
          ${{ matrix.arch == 'x86' && 'mingw-w64-i686-gcc' || 'mingw-w64-ucrt-x86_64-gcc' }}
          ${{ matrix.arch == 'x86' && 'mingw-w64-i686-pkg-config' || 'mingw-w64-ucrt-x86_64-pkg-config' }}

    - name: Clone and build ssdeep
      shell: msys2 {0}
      run: |
        MSYS2_WORKSPACE=$(cygpath -u '${{ github.workspace }}')

        git clone https://github.com/ssdeep-project/ssdeep.git --depth 1
        cd ssdeep
        autoreconf -i
        
        if [ "${{ matrix.arch }}" = "x86" ]; then
          ./configure --enable-shared --disable-static CFLAGS="-O3" CXXFLAGS="-O3" --build=i686-pc-mingw32
        else
          ./configure --enable-shared --disable-static CFLAGS="-O3" CXXFLAGS="-O3"
        fi
        
        make dll

        mkdir -p "${MSYS2_WORKSPACE}/ssdeep-install/"
        cp -v fuzzy.dll "${MSYS2_WORKSPACE}/ssdeep-install/"
        cp -v fuzzy.h "${MSYS2_WORKSPACE}/ssdeep-install/"
        cp -v fuzzy.def "${MSYS2_WORKSPACE}/ssdeep-install/"

    - name: Restore vcpkg cache
      id: vcpkg-cache
      uses: TAServers/vcpkg-cache@e848939f754daf406a06006be2e05eb5b17cc481
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        prefix: vcpkg-iis-module-${{ matrix.arch }}/

    - uses: ammaraskar/msvc-problem-matcher@1ebcb382869bfdc2cc645e8a2a43b6d319ea1cc0

    - name: Configure CMake for IIS Module
      env:
        VCPKG_FEATURE_FLAGS: "binarycaching"
        VCPKG_BINARY_SOURCES: "clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite"
        VCPKG_DEFAULT_TRIPLET: ${{ matrix.arch }}-windows
      run: |
        $archFlag = "${{ matrix.arch }}"
        $cmakeArch = if ($archFlag -eq "x86") { "Win32" } else { "x64" }
        $installDir = if ($archFlag -eq "x86") { "x86" } else { "amd64" }

        cmake `
        -DAPACHE_ROOT="$env:APACHE_ROOT" `
        -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\iis\release\$installDir" `
        -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
        -DSSDEEP_ROOT="${{ github.workspace }}\ssdeep-install" `
        -DWITH_SSDEEP=ON `
        -A $cmakeArch `
        -DWITH_LUA=ON `
        -DWITH_YAJL=ON `
        -S IIS -B "iis\build"

    - name: Build IIS Module
      shell: pwsh
      run: |
        cmake --build "iis\build" --config ${{ matrix.config }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iis-module-${{ matrix.arch }}-${{ matrix.config }}
        path: iis/build/${{ matrix.config }}/
    
  package:
    needs: build
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Release, RelWithDebInfo]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Download x64 artifacts
      uses: actions/download-artifact@v4
      with:
        name: iis-module-x64-${{ matrix.config }}
        path: iis/release/amd64/

    - name: Download x86 artifacts
      uses: actions/download-artifact@v4
      with:
        name: iis-module-x86-${{ matrix.config }}
        path: iis/release/x86/

    - name: Generate MSI files
      shell: pwsh
      run: |
        heat dir "iis\release\amd64" -cg ModSec64Components -dr inetsrv64 -gg -sreg -srd -var var.ModSecurityIISRelease64 -out "iis\ModSec64.wxs"
        heat dir "iis\release\x86" -cg ModSec32Components -dr inetsrv32 -gg -sreg -srd -var var.ModSecurityIISRelease32 -out "iis\ModSec32.wxs"
        candle.exe -ext WixUtilExtension -ext WixUIExtension "iis\installer.wxs" "iis\ModSec64.wxs" -arch x64 -dModSecurityIISRelease64="iis\release\amd64\" -out iis\
        candle.exe -ext WixUtilExtension -ext WixUIExtension "iis\ModSec32.wxs" -arch x86 -dModSecurityIISRelease32="iis\release\x86\" -out iis\
        light.exe -ext WixUtilExtension -ext WixUIExtension "iis\installer.wixobj" "iis\ModSec32.wixobj" "iis\ModSec64.wixobj" -out "iis\modsecurityiis.msi"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: modsecurityiis-installers-${{ matrix.config }}
        path: iis/modsecurityiis.msi

  test:
    needs: package
    # Reporter's crash is on Windows Server 2025 (build 26100) with its newer ucrtbase.
    # windows-latest is Server 2022, so run the repro on Server 2025 to match the faulting
    # runtime. The MSI is OS-portable; only the worker's host OS/ucrtbase matters for a
    # c0000409. Revert to windows-latest if this label is not available to the account.
    runs-on: windows-2025
    strategy:
      matrix:
        config: [Release, RelWithDebInfo]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Download MSI files
      uses: actions/download-artifact@v4
      with:
        name: modsecurityiis-installers-${{ matrix.config }}
        path: ${{ github.workspace }}/

    - name: Install MSI
      shell: pwsh
      run: |
        $msiPath = "${{ github.workspace }}\modsecurityiis.msi"
        if (-not (Test-Path $msiPath)) {
          Write-Error "MSI file not found at $msiPath"
          exit 1
        }
        
        # Install with logging for debugging
        $installLog = "${{ github.workspace }}\install.log"
        $installResult = Start-Process -FilePath "msiexec.exe" -ArgumentList @(
          "/i", "`"$msiPath`"",
          "/qn",
          "/norestart",
          "/l*", "`"$installLog`""
        ) -Wait -PassThru
        
        if ($installResult.ExitCode -ne 0) {
          Write-Error "MSI installation failed with exit code $($installResult.ExitCode)"
          Get-Content $installLog | Write-Host
          exit 1
        }
        
        $installDir = "C:\Program Files\ModSecurity IIS"
        $requiredFiles = @(
          "modsecurity.conf",
          "modsecurity_iis.conf"
        )
        
        foreach ($file in $requiredFiles) {
          $filePath = Join-Path $installDir $file
          if (-not (Test-Path $filePath)) {
            Write-Error "Required file $file not found in installation directory"
            exit 1
          }
        }

    - name: Install OWASP Core Rules
      shell: pwsh
      run: |
        $crsVersion = "v4.18.0"
        $crsUrl = "https://github.com/coreruleset/coreruleset/archive/refs/tags/$crsVersion.tar.gz"
        $crsDir = "C:\Program Files\ModSecurity IIS\coreruleset"
        $modSecurityConfigDir = "C:\Program Files\ModSecurity IIS"

        try {
          New-Item -ItemType Directory -Path $crsDir -Force
          Invoke-WebRequest -Uri $crsUrl -OutFile "$crsDir\$crsVersion.tar.gz"
          tar -xzf "$crsDir\$crsVersion.tar.gz" -C $crsDir --strip-components=1

          Get-ChildItem "$crsDir" -Recurse -Filter "*.example" | ForEach-Object {
              $newName = $_.Name.Replace(".example", "")
              Rename-Item -Path $_.FullName -NewName $newName
          }
          
          $modSecurityConfigFile = "$modSecurityConfigDir\modsecurity_iis.conf"

          $crsRules = @(
            "Include coreruleset/crs-setup.conf",
            "Include coreruleset/plugins/*-config.conf",
            "Include coreruleset/plugins/*-before.conf",
            "Include coreruleset/rules/*.conf",
            "Include coreruleset/plugins/*-after.conf"
          )

          Add-Content -Path $modSecurityConfigFile -Value $crsRules

          (Get-Content -Path $modSecurityConfigDir\modsecurity.conf) -replace 'SecRuleEngine DetectionOnly', 'SecRuleEngine On' | Set-Content -Path $modSecurityConfigDir\modsecurity.conf

        }
        catch {
            Write-Error "Failed to install OWASP Core Rules: $($_.Exception.Message)"
            exit 1
        }

    - name: Test IIS Module
      shell: pwsh
      run: |
        $iisConfigDir = "C:\Program Files\ModSecurity IIS\"

        Restart-Service W3SVC -Force

        $modules = & "$env:SystemRoot\system32\inetsrv\appcmd.exe" list modules
        Write-Host "IIS modules: $modules"
        if ($LASTEXITCODE -ne 0) {
            Write-Error "appcmd failed with exit code $LASTEXITCODE"
            exit 1
        }

        if (-not ($modules -match "ModSecurity")) {
            Write-Error "ModSecurity module not found in IIS modules"
            Write-Host "IIS modules: $modules"
            exit 1
        }

        $testCases = @(
            @{Url = "http://localhost/"; Description = "Normal request"; ExpectedCode = 200},
            @{Url = "http://localhost/?id=1' OR '1'='1"; Description = "SQL injection attempt"; ExpectedCode = 403},
            @{Url = "http://localhost/?q=<script>alert('test')</script>"; Description = "XSS attempt"; ExpectedCode = 403}
        )
        
        foreach ($test in $testCases) {
            try {
                $response = Invoke-WebRequest $test.Url -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 30
                
                if ($response.StatusCode -eq $test.ExpectedCode) {
                    Write-Host "PASS: $($test.Description) - returned $($response.StatusCode)"
                }
                else {
                    Write-Host "FAIL: $($test.Description) - expected $($test.ExpectedCode) but got $($response.StatusCode)"
                }
            }
            catch {
                Write-Host "ERROR: $($test.Description) - request failed: $($_.Exception.Message)"
            }
        }
        

        # Check event log
        $badMessagePattern = 'Failed to find the RegisterModule entrypoint|The description for Event ID|The data is the error|dll failed to load'

        $events = Get-EventLog -LogName Application -Newest 100 |
            Where-Object { $_.Message -match $badMessagePattern } |
            Where-Object { $_.Source -match 'IIS|W3SVC|mscor|IIS-W3SVC|IIS-W3WP|ModSecurity' }

        if ($events -and $events.Count -gt 0) {
            Write-Host '::error:: Found errors in event log'
            $events | Select-Object TimeGenerated, Source, EntryType, EventID, Message | Format-List
            Exit 1
        }

        Get-EventLog -LogName Application -Source ModSecurity | Format-List

    # Investigative step for issue #3397: a large multipart upload crashing w3wp.exe
    # with c0000409 (STATUS_STACK_BUFFER_OVERRUN) in ucrtbase.dll. Informational only;
    # never fails the job so the whole run stays green and the log is readable.
    - name: Repro #3397 (large multipart upload)
      if: always()
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        Write-Host '>>> 3397-REPRO BEGIN'

        # Mirror #3397 out-of-the-box config, and additionally enable ModSecurity
        # debug + audit logging so a fault leaves a trace of how far the module got
        # while reading the request body.
        $mstemp = 'c:\inetpub\temp'
        New-Item -ItemType Directory -Force -Path $mstemp | Out-Null
        New-Item -ItemType Directory -Force -Path 'c:\inetpub\logs' | Out-Null
        $dbgLog = Join-Path $mstemp 'msc_debug.log'
        $auditLog = Join-Path $mstemp 'msc_audit.log'

        # The w3wp worker runs as the application pool identity and MUST be able to write
        # these paths, otherwise ModSecurity fails to open the logs at config load (cf. #812).
        $appcmdPre = Join-Path $env:SystemRoot 'system32\inetsrv\appcmd.exe'
        $pool = (& $appcmdPre list apppool /text:name 2>$null | Select-Object -First 1)
        if (-not $pool) { $pool = 'DefaultAppPool' }
        Write-Host ("app pool identity: IIS APPPOOL\{0}" -f $pool)
        $principals = @("IIS APPPOOL\$pool", 'IIS_IUSRS', 'NETWORK SERVICE')
        foreach ($d in @($mstemp, 'c:\inetpub\logs')) {
          foreach ($p in $principals) { & icacls $d /grant ("{0}:(OI)(CI)M" -f $p) /t /c 2>&1 | Out-Null }
        }
        foreach ($f in @($dbgLog, $auditLog)) {
          if (-not (Test-Path $f)) { New-Item -ItemType File -Force -Path $f | Out-Null }
          foreach ($p in $principals) { & icacls $f /grant ("{0}:M" -f $p) /c 2>&1 | Out-Null }
        }

        # Reporter ran the OUT-OF-BOX config (SecRuleEngine DetectionOnly, NO ruleset).
        # Match it: keep DetectionOnly, point debug+audit logs at the writable temp dir,
        # and neutralize the CRS includes (installed earlier in this job) for the window.
        $conf = 'C:\Program Files\ModSecurity IIS\modsecurity.conf'
        if (Test-Path $conf) {
          $c = Get-Content $conf
          $c = $c -replace 'SecRuleEngine\s+On\b','SecRuleEngine DetectionOnly'
          $c = $c -replace '#?\s*SecDebugLog\s+.*',("SecDebugLog {0}" -f $dbgLog)
          $c = $c -replace '#?\s*SecDebugLogLevel\s+.*','SecDebugLogLevel 5'
          $c = $c -replace 'SecAuditEngine RelevantOnly','SecAuditEngine On'
          $c = $c -replace '#?\s*SecAuditLog\s+.*',("SecAuditLog {0}" -f $auditLog)
          $c = $c -replace 'SecAuditLogParts\s+.*','SecAuditLogParts ABCDEFGHIJKZ'
          Set-Content $conf $c
          Write-Host ("debug log -> {0}" -f $dbgLog)
          Write-Host ("audit log -> {0}" -f $auditLog)
        }

        # Disable the CRS includes so this behaves like the stock (ruleless) install.
        $iisconf = 'C:\Program Files\ModSecurity IIS\modsecurity_iis.conf'
        $iisBak = Join-Path $env:RUNNER_TEMP 'modsecurity_iis.conf.orig'
        $crsDisabled = $false
        if (Test-Path $iisconf) {
          Copy-Item $iisconf $iisBak -Force
          $ic = Get-Content $iisconf
          if (($ic | Select-String -SimpleMatch 'coreruleset' -Quiet)) {
            $ic = $ic -replace '^\s*Include\s+.*coreruleset.*', '# 3397repro: $0'
            Set-Content $iisconf $ic
            $crsDisabled = $true
            Write-Host 'CRS includes disabled for repro window'
          }
        }

        # Enable WER local dumps for w3wp so a real fault leaves a .dmp we can count.
        $dumpDir = Join-Path $env:RUNNER_TEMP 'w3wp-dumps'
        New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
        $ld = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\w3wp.exe'
        New-Item -Force -Path $ld | Out-Null
        New-ItemProperty -Force -Path $ld -Name DumpFolder -Value $dumpDir -PropertyType ExpandString | Out-Null
        New-ItemProperty -Force -Path $ld -Name DumpType -Value 1 -PropertyType DWord | Out-Null
        $dumpsBefore = @(Get-ChildItem $dumpDir -Filter *.dmp -ErrorAction SilentlyContinue).Count

        # Reporter crashed on a 4.5MB image AND a 12MB pdf (size-driven, content-agnostic),
        # all under SecRequestBodyLimit 13107200 and over SecRequestBodyInMemoryLimit 131072.
        # Build 2MB / 6MB / 12MB (just under limit) and 14MB (just over -> Reject path).
        $dir = Join-Path $env:RUNNER_TEMP 'mscrepro3397'
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        $small = Join-Path $dir 'small.bin'
        [System.IO.File]::WriteAllBytes($small, [byte[]]((48..57) * 100))
        $chunk = [byte[]](0..255)
        $sizes = 2, 6, 12, 14
        $bigFiles = @()
        foreach ($s in $sizes) {
          $f = Join-Path $dir ("big{0}.bin" -f $s)
          $ms = New-Object System.IO.MemoryStream
          $target = [long]$s * 1MB
          while ($ms.Length -lt $target) { $ms.Write($chunk, 0, $chunk.Length) }
          $bytes = $ms.ToArray()
          if ($bytes.LongLength -gt $target) { $bytes = $bytes[0..($target-1)] }
          [System.IO.File]::WriteAllBytes($f, $bytes)
          Write-Host ("upload file: {0} = {1}B" -f (Split-Path $f -Leaf), (Get-Item $f).Length)
          $bigFiles += $f
        }

        # Best-effort IIS Failed Request Tracing (FREB) so the pipeline records where the
        # 500 originates. Enabling it recycles the pool, so do it BEFORE the baseline warm-up.
        $appcmd = Join-Path $env:SystemRoot 'system32\inetsrv\appcmd.exe'
        $site = (& $appcmd list site /text:name 2>$null | Select-Object -First 1)
        if (-not $site) { $site = 'Default Web Site' }
        Write-Host ("Enabling FREB on site: {0}" -f $site)
        & $appcmd configure trace $site /enablesite 2>&1 | Out-Null
        & $appcmd configure trace $site /enable /path:* /iisWarnings:true /iisErrors:true /aspErrors:true /security:true /refresh:true 2>&1 | Out-Null

        # Warm up so a worker exists BEFORE the measurement (no service restart inside the window,
        # otherwise PID churn is just the recycle and proves nothing).
        & curl.exe -s -o NUL -w 'warmup -> HTTP %{http_code}\n' 'http://localhost/'
        Start-Sleep -Seconds 2
        function Get-W3wp { @(Get-Process w3wp -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id) }
        $start = (Get-Date)

        # The default site is static-only: a POST to a missing path 404s and IIS never hands
        # the entity to the module, so the request-body read path (the crash locus) is not
        # exercised. Stand up a body-consuming ASP.NET endpoint (analog of WordPress
        # admin-ajax.php) so ModSecurity actually reads the large multipart body.
        & $appcmd set apppool 'DefaultAppPool' /managedRuntimeVersion:v4.0 /managedPipelineMode:Integrated 2>&1 | Out-Null
        $aspx = 'C:\inetpub\wwwroot\up.aspx'
        $aspxB64 = ''
        [System.IO.File]::WriteAllBytes($aspx, [System.Convert]::FromBase64String($aspxB64))
        # Raise ASP.NET's own request-size limits (default maxRequestLength is 4MB) so the
        # sink accepts the whole 2-14MB sweep with a clean 200. Without this, ASP.NET 500s
        # large bodies and we cannot tell a backend limit from a real w3wp fault.
        $webcfg = 'C:\inetpub\wwwroot\web.config'
        $webcfgB64 = ''
        [System.IO.File]::WriteAllBytes($webcfg, [System.Convert]::FromBase64String($webcfgB64))
        & $appcmd set config 'Default Web Site' /section:system.webServer/security/requestFiltering/requestLimits /maxAllowedContentLength:2147483647 /commit:apphost 2>&1 | Out-Null
        $url = 'http://localhost/up.aspx'
        # Confirm the endpoint works (200) before measuring; otherwise ASP.NET is not registered.
        & curl.exe -s -o NUL -w ('aspx probe GET -> HTTP %{http_code}' + "`n") --max-time 30 $url
        # Pre-flight: a 6MB chunked POST must return 200. If it 500s, the backend (not
        # ModSecurity) is still capping size and the sweep below is not trustworthy.
        $pf = & curl.exe -s -o NUL -w '%{http_code}' -X POST -H 'Transfer-Encoding: chunked' -H 'Content-Type: application/octet-stream' --data-binary "@$($bigFiles[1])" --max-time 120 $url
        Write-Host ("PREFLIGHT 6MB chunked POST -> HTTP {0} (want 200)" -f $pf)

        # Control: small multipart POST (should be 200 -> proves endpoint reads bodies).
        $resp = Join-Path $env:RUNNER_TEMP 'resp.txt'
        $cSmall = & curl.exe -s -o $resp -w '%{http_code}' -F "file=@$small" --max-time 120 $url
        Write-Host ("CONTROL small POST -> HTTP {0}" -f $cSmall)

        # Sweep every size, two ways:
        #   (a) multipart with a known Content-Length,
        #   (b) chunked / unknown-length -> the realloc-growth branch of the IIS-only
        #       MSC_LARGE_STREAM_INPUT request-body streaming path (unreachable on Linux).
        $baseline = Get-W3wp
        Write-Host ("w3wp PIDs baseline: {0}" -f ($baseline -join ','))
        $pidsNow = $baseline
        $crashSeen = $false
        $n = 0
        foreach ($f in $bigFiles) {
          $leaf = Split-Path $f -Leaf
          foreach ($mode in 'multipart','chunked') {
            $n++
            if ($mode -eq 'multipart') {
              $code = & curl.exe -s -o $resp -w '%{http_code}' -F "file=@$f" --max-time 120 $url
            } else {
              $code = & curl.exe -s -o $resp -w '%{http_code}' -X POST -H 'Transfer-Encoding: chunked' -H 'Content-Type: application/octet-stream' --data-binary "@$f" --max-time 120 $url
            }
            $dNow = @(Get-ChildItem $dumpDir -Filter *.dmp -ErrorAction SilentlyContinue).Count
            $pidsNow = Get-W3wp
            $pidChurn = (($baseline | Sort-Object) -join ',') -ne (($pidsNow | Sort-Object) -join ',')
            Write-Host ("POST #{0} [{1} {2}] -> HTTP {3} | w3wp=[{4}] | dumps={5}" -f $n, $leaf, $mode, $code, ($pidsNow -join ','), $dNow)
            if ($dNow -gt $dumpsBefore -or $pidChurn) { $crashSeen = $true }
            Start-Sleep -Milliseconds 400
          }
        }

        # Verdict: a crash is indicated by (a) new w3wp .dmp, (b) worker PID set change with no restart,
        # (c) an Application Error / WER event naming w3wp.
        $dumpsAfter = @(Get-ChildItem $dumpDir -Filter *.dmp -ErrorAction SilentlyContinue)
        $newDumps = $dumpsAfter.Count - $dumpsBefore
        Write-Host ("new w3wp dumps: {0}" -f $newDumps)
        if ($newDumps -gt 0) { $dumpsAfter | ForEach-Object { Write-Host ("DUMP: {0}" -f $_.FullName) } }
        $pidChanged = (($baseline | Sort-Object) -join ',') -ne (($pidsNow | Sort-Object) -join ',')
        if ($pidChanged) { Write-Host '>>> 3397-SIGNAL: w3wp PID changed with no service restart' }

        # Targeted event-log scan.
        $ae = Get-WinEvent -FilterHashtable @{ LogName='Application'; ProviderName='Application Error'; StartTime=$start } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'w3wp' }
        $wer = Get-WinEvent -FilterHashtable @{ LogName='Application'; ProviderName='Windows Error Reporting'; StartTime=$start } -ErrorAction SilentlyContinue |
               Where-Object { $_.Message -match 'w3wp' }
        foreach ($e in @($ae) + @($wer)) {
          if ($e) {
            Write-Host '---EVENT---'
            Write-Host $e.Message
            if ($e.Message -match '(?i)exception code:\s*([0-9a-fx]+)') { Write-Host (">>> 3397-EXC: {0}" -f $matches[1]) }
            if ($e.Message -match '(?i)faulting module:\s*(\S+)')        { Write-Host (">>> 3397-MOD: {0}" -f $matches[1]) }
          }
        }
        if (-not $ae -and -not $wer) { Write-Host '>>> 3397-CANDIDATE: no w3wp Application Error / WER events' }

        if ($newDumps -gt 0 -or $ae) {
          Write-Host '>>> 3397-REPRO RESULT: w3wp fault CONFIRMED on large upload'
        } elseif ($crashSeen -or $pidChanged -or ($wer -and $pidChanged)) {
          Write-Host '>>> 3397-REPRO RESULT: worker recycled/churn during sweep (possible fault, no dump/event captured yet)'
        } else {
          Write-Host '>>> 3397-REPRO RESULT: no fault signal observed'
        }

        # --- Logging artifacts: how far did ModSecurity get reading the body? ---
        Write-Host '>>> 3397-DEBUGLOG body markers:'
        if (Test-Path $dbgLog) {
          Select-String -Path $dbgLog -Pattern 'Request Body|Content-Length|Transfer-Encoding|Streaming|stream_input|multipart|Multipart|incomplete|Reading|Transfer' -ErrorAction SilentlyContinue |
            Select-Object -Last 30 | ForEach-Object { Write-Host ("  DBG: {0}" -f $_.Line.Trim()) }
          Write-Host '>>> 3397-DEBUGLOG tail:'
          Get-Content $dbgLog -Tail 60 -ErrorAction SilentlyContinue
        } else { Write-Host '(no debug log produced)' }

        Write-Host (">>> 3397-AUDITLOG present: {0}" -f (Test-Path $auditLog))
        if ((Test-Path $auditLog) -and ((Get-Item $auditLog).Length -gt 0)) {
          Write-Host (">>> 3397-AUDITLOG size: {0} bytes" -f (Get-Item $auditLog).Length)
          $auditHits = Select-String -Path $auditLog -Pattern 'ModSecurity|Action|intercepted|discarded|Request Body|Status:' -ErrorAction SilentlyContinue | Select-Object -First 15
          $auditHits | ForEach-Object { Write-Host ("  AUDIT: {0}" -f $_.Line.Trim()) }
        }

        Write-Host '>>> 3397-FREB files:'
        $frb = Get-ChildItem -Path 'C:\inetpub\logs\FailedReqLogFiles' -Recurse -Filter '*.xml' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 3
        if (-not $frb) { Write-Host '(no FREB xml captured)' }
        foreach ($x in $frb) {
          Write-Host ("FREB: {0}" -f $x.FullName)
          Select-String -Path $x.FullName -Pattern 'StatusCode="500"|subStatusCode|ModSecurity|mod_security|ModuleName|Module="|handlerName|System.Web' -ErrorAction SilentlyContinue |
            Select-Object -First 10 | ForEach-Object { Write-Host ("   {0}" -f $_.Line.Trim()) }
        }

        # Show the last response body snippet (what the 500 actually says).
        if (Test-Path $resp) {
          $body = (Get-Content $resp -Raw -ErrorAction SilentlyContinue)
          if ($body) { Write-Host '>>> 3397-BODY:'; Write-Host ($body.Substring(0, [Math]::Min(600, $body.Length))) }
        }

        # Restore the CRS includes so the downstream go-ftw step still exercises CRS.
        if ($crsDisabled -and (Test-Path $iisBak)) {
          Copy-Item $iisBak $iisconf -Force
          & $appcmd recycle apppool 'DefaultAppPool' 2>&1 | Out-Null
          Write-Host 'CRS includes restored for downstream tests'
        }

        Write-Host '>>> 3397-REPRO END'

    - name: Install go-ftw
      shell: pwsh
      run: |
        go install github.com/coreruleset/go-ftw@latest

    # Certain rules are disabled due to specific IIS behavior patterns.
    # Using go-ftw in cloud mode as the IIS connector does not generate logs in file format.
    # Technically, Event logs can be streamed to files, but this requires implementing rate limits to avoid log overflow.
    - name: Test ModSecurity Rules
      shell: pwsh
      run: |
        $testRuleDir = "C:\Program Files\ModSecurity IIS\coreruleset\tests\regression\tests"
        $goBinPath = ""
        if ($env:GOBIN) {
            $goBinPath = $env:GOBIN
        } elseif ($env:GOPATH) {
            $goBinPath = Join-Path $env:GOPATH "bin"
        } else {
            $goBinPath = Join-Path $env:USERPROFILE "go\bin"
        }

        & "$goBinPath\go-ftw.exe" run -d $testRuleDir --cloud -e "920100-2$|920100-4$|920100-8$|920100-12$|920272-5$|920290-1$|920620-1$|920380-1$" --show-failures-only

