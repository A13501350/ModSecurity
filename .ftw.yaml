logfile: c:\inetpub\logs\modsec_audit.log
logmarkerheadername: X-CRS-Test
mode: "default"
testoverride:
  input:
    dest_addr: "localhost"
    port: 80
    protocol: "http"

# Scope the regression run to the 920 request/headers family. This is a build
# smoke test, not a full CRS compliance run.
#
# The `exclude` regex skips the 16 tests whose expectations cannot hold on
# IIS/HTTP.SYS even though the module behaves correctly (go-ftw matches against
# the test IdString() "<ruleId>-<testId>"). Rationale per test:
#   - 920100-2/-8/-12: HTTP.SYS accepts leading whitespace / colon-in-path
#     request lines that Apache rejects with 400.
#   - 920100-10/-14: unknown verbs (e.g. |GET) are mapped to method "INVALID" by
#     the module, so the rebuilt request line matches 920100's whitelist regex
#     and the rule cannot fire (see iis/mymodule.cpp request_line build).
#   - 920100-4: HTTP.SYS rejects a valid CONNECT request line with 400.
#   - 920180-1/-3: HTTP.SYS rejects CL-less POST with 411 before the module runs,
#     so 920180 can never match.
#   - 920181-1: ARR returns 502 when both CL and TE are present, and the module
#     does fire 920181 (Apache strips CL, so the CRS baseline differs).
#   - 920200-4, 920350-1/-3, 920430-8, 920520-7: HTTP.SYS rejects the malformed
#     Range / Host / HTTP version / Accept-Encoding with 400/505 before the
#     module runs, so those rules can never match.
#   - 920290-1: HTTP.SYS accepts an empty Host header (200) that Apache rejects
#     with 400.
#   - 920620-1: HTTP.SYS rejects duplicate Content-Type headers with 400 before
#     the module runs, so 920620 can never match.
include: "^920"
exclude: "^(920100-(2|4|8|10|12|14)|920180-(1|3)|920181-1|920200-4|920290-1|920350-(1|3)|920430-8|920520-7|920620-1)$"
